# Mergify automatically queues ready PRs once the repository's ruleset
# is migrated off GitHub's native merge_queue rule.

merge_protections:
  - name: Plainword CI
    description: Require the test suite to pass before merge.
    if:
      - base = main
    success_conditions:
      - check-success = test

merge_protections_settings:
  auto_merge_conditions: true
  post_comment: true
  reporting_method: check-runs

queue_rules:
  - name: main
    merge_method: squash
    queue_conditions:
      - base = main
    merge_conditions:
      - check-success = test
