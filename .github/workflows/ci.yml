name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Mergify Test Engine upload authenticates with the job's ID token
      contents: read # actions/checkout
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
      # npm does not run dependency install scripts in every version.
      - run: |
          npm install --global bun@1.4.4
          bun_package_dir="$(npm root --global)/bun"
          if ! "$bun_package_dir/bin/bun.exe" --version; then
            (cd "$bun_package_dir" && node install.js)
          fi
      - run: bun install --frozen-lockfile
      # The spec reporter keeps the console output; tools/junit-reporter.mjs writes the JUnit report for Mergify.
      - id: tests
        run: npm test -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./tools/junit-reporter.mjs --test-reporter-destination=junit.xml
      - run: sh tools/deploy.sh cloudflare.example.env --dry-run
      - run: node tools/check-addresses.mjs
      # Uploads the JUnit report with the job's ID token; skipped on pull requests from forks, which get none.
      - name: Mergify Test Engine Upload
        if: (success() || failure()) && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && hashFiles('junit.xml') != ''
        env:
          MERGIFY_TEST_EXIT_CODE: ${{ steps.tests.outcome == 'success' && '0' || '1' }}
        run: pipx run --spec mergify-cli==2026.11.22 mergify ci junit-process junit.xml
